<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine Surprise</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    /* Logo */
    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 6px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 56px;
      margin: 10px 0 30px;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 40px;
      font-weight: normal;
    }

    .buttons {
      display: flex;
      gap: 40px;
      position: relative;
    }

    button {
      font-size: 28px;
      padding: 18px 48px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
      font-weight: bold;
    }

    #no {
      background-color: #555;
      color: white;
      position: relative;
    }

    .itinerary {
      max-width: 720px;
      font-size: 22px;
      line-height: 1.6;
      margin-top: 40px;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 10px;
      background-color: white;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="logo">RPRP</div>

  <h1>Will you be my Valentine?</h1>
  <h2>Rebecca · Becky · Becks · Becca · Rebe · Mini · Tiny · Prechocha</h2>

  <div class="buttons">
    <button id="yes">YES</button>
    <button id="no">NO</button>
  </div>

  <div id="schedule" class="itinerary"></div>

  <!-- Music -->
  <audio id="song" loop>
    <source src="https://archive.org/download/JuanGabrielQuerida/Juan%20Gabriel%20-%20Querida.mp3" type="audio/mpeg">
  </audio>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const schedule = document.getElementById("schedule");
    const song = document.getElementById("song");

    // Keep NO inside screen
    noBtn.addEventListener("mouseover", () => {
      const padding = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.position = "fixed";
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;

      yesBtn.style.transform = "scale(1.08)";
    });

    // Confetti effect
    function confetti() {
      for (let i = 0; i < 120; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * window.innerWidth + "px";
        c.style.backgroundColor = ["#fff", "#ff4d6d", "#ffd1dc"][Math.floor(Math.random()*3)];
        c.style.animationDuration = 2 + Math.random() * 2 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }
    }

    // Fade-in music
    function fadeInMusic() {
      song.volume = 0;
      song.play();
      let v = 0;
      const fade = setInterval(() => {
        if (v < 0.35) {
          v += 0.02;
          song.volume = v;
        } else {
          clearInterval(fade);
        }
      }, 200);
    }

    yesBtn.addEventListener("click", () => {
      confetti();
      fadeInMusic();

      schedule.innerHTML = `
        <h1>Perfect.</h1>

        <p>
          I would love to formally invite you to spend Valentine’s Day together —
          a full day intentionally planned to celebrate us, have fun, and make memories.
        </p>

        <p><strong>8:30 AM</strong> — Atlanta Mission 5K<br>
        Pemberton Place · 126 Ivan Allen Jr Blvd NW, Atlanta</p>

        <p><strong>12:00 PM</strong> — A surprise just for you</p>

        <p><strong>4:30 PM</strong> — The Crossing Steakhouse<br>
        40 South Peachtree St, Norcross</p>

        <p><strong>7:10 PM</strong> — Atlanta Gladiators vs Adirondack<br>
        Gas South Arena · Duluth</p>

        <p><strong>11:00 PM – 3:00 AM</strong> — Candela Night<br>
        269 Armour Dr NE, Atlanta</p>
      `;
    });
  </script>

</body>
</html>
