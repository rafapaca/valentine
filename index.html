<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine Surprise</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      margin: 0;
      min-height: 100vh; /* Changed to min-height */
      overflow-y: auto;  /* Allows scrolling */
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      color: white;
      text-align: center;
      box-sizing: border-box;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 6px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(32px, 8vw, 56px);
      margin: 10px 0 20px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 40px;
      font-weight: normal;
      opacity: 0.9;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
    }

    button {
      font-size: 24px;
      padding: 15px 40px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
      font-weight: bold;
    }

    #no {
      background-color: #fff;
      color: #555;
    }

    .itinerary {
      max-width: 600px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      margin-top: 30px;
      display: none; /* Hidden until YES is clicked */
      animation: fadeIn 1s ease;
    }

    .cat-gif {
      width: 150px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .emoji-row {
      font-size: 30px;
      margin: 15px 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 10px;
      z-index: 100;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="logo">RPRP</div>

  <div id="main-content">
    <h1>Will you be my Valentine?</h1>
    <h2>Rebecca · Becky · Becks · Becca · Rebe · Mini · Tiny · Prechocha</h2>

    <div class="buttons">
      <button id="yes">YES! ❤️</button>
      <button id="no">No</button>
    </div>
  </div>

  <div id="schedule" class="itinerary">
    </div>

  <audio id="song" loop>
    <source src="https://archive.org/download/JuanGabrielQuerida/Juan%20Gabriel%20-%20Querida.mp3" type="audio/mpeg">
  </audio>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const schedule = document.getElementById("schedule");
    const song = document.getElementById("song");

    // "No" button runs away
    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    function confetti() {
      for (let i = 0; i < 100; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.backgroundColor = ["#fff", "#ff4d6d", "#ffd1dc"][Math.floor(Math.random()*3)];
        c.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }
    }

    yesBtn.addEventListener("click", () => {
      // Start Music
      song.volume = 0.5;
      song.play().catch(e => console.log("Audio play blocked by browser. Click again!"));
      
      confetti();
      
      // Reveal Schedule
      schedule.style.display = "block";
      schedule.innerHTML = `
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZueCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3oriO0OEd9QIDdllqo/giphy.gif" alt="Cute Cat" class="cat-gif">
        <div class="emoji-row">✨ 💖 🌹 🧸 ✨</div>
        <h1>Perfect.</h1>
        <p>I would love to formally invite you to spend Valentine’s Day together — a day intentionally planned to celebrate us.</p>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.3); margin: 20px 0;">
        <p>🏃‍♂️ <strong>8:30 AM</strong> — Atlanta Mission 5K</p>
        <p>🎁 <strong>12:00 PM</strong> — A surprise just for you</p>
        <p>🥩 <strong>4:30 PM</strong> — The Crossing Steakhouse</p>
        <p>🏒 <strong>7:10 PM</strong> — Atlanta Gladiators vs Adirondack</p>
        <p>💃 <strong>11:00 PM</strong> — Candela Night</p>
        <div class="emoji-row">🥂 💌 ✨</div>
      `;

      // Smooth scroll to the itinerary
      setTimeout(() => {
        schedule.scrollIntoView({ behavior: 'smooth' });
      }, 100);
    });
  </script>

</body>
</html>
