<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine Surprise</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      margin: 0;
      min-height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      color: white;
      text-align: center;
      box-sizing: border-box;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 6px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: clamp(32px, 8vw, 56px);
      margin: 10px 0 20px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 40px;
      font-weight: 300;
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 50px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
      min-height: 100px;
    }

    button {
      font-size: 24px;
      padding: 15px 40px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
      font-weight: bold;
      z-index: 10;
    }

    #no {
      background-color: #fff;
      color: #555;
      white-space: nowrap;
    }

    .itinerary {
      max-width: 600px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      padding: 40px 20px;
      border-radius: 30px;
      margin-top: 30px;
      display: none;
      border: 2px solid rgba(255,255,255,0.3);
      animation: fadeIn 1.2s ease-out;
    }

    .cat-gif {
      width: 180px;
      border-radius: 20px;
      margin: 15px 0;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .emoji-float {
      font-size: 35px;
      margin: 20px 0;
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .confetti {
      position: fixed;
      top: -10px;
      z-index: 100;
      pointer-events: none;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="logo">RPRP</div>

  <div id="main-container">
    <h1>Will you be my Valentine?</h1>
    <h2>Rebecca · Becky · Becks · Becca · Rebe · Mini · Tiny · Prechocha</h2>

    <div class="buttons">
      <button id="yes">YES! ❤️</button>
      <button id="no">No</button>
    </div>
  </div>

  <div id="schedule" class="itinerary">
    </div>

  <audio id="song" loop>
    <source src="https://archive.org/download/JuanGabrielQuerida/Juan%20Gabriel%20-%20Querida.mp3" type="audio/mpeg">
  </audio>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const schedule = document.getElementById("schedule");
    const song = document.getElementById("song");
    
    let noScale = 1;
    let yesScale = 1;

    // Shrinking NO button logic
    noBtn.addEventListener("mouseover", () => {
      noScale -= 0.15;
      yesScale += 0.1;
      
      if (noScale < 0.2) {
        noBtn.style.display = "none"; // Disappear when too small
      } else {
        noBtn.style.transform = `scale(${noScale})`;
        // Yes button grows to encourage her!
        yesBtn.style.transform = `scale(${yesScale})`;
        
        // Move it slightly so it feels like it's dodging
        const x = (Math.random() - 0.5) * 100;
        const y = (Math.random() - 0.5) * 100;
        noBtn.style.translate = `${x}px ${y}px`;
      }
    });

    function celebrate() {
      const emojis = ['❤️', '💖', '🌹', '✨', '🐱', '💘'];
      for (let i = 0; i < 100; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        c.style.left = Math.random() * 100 + "vw";
        c.style.fontSize = (Math.random() * 20 + 10) + "px";
        c.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }
    }

    yesBtn.addEventListener("click", () => {
      // Audio play
      song.volume = 0;
      song.play();
      let v = 0;
      const fade = setInterval(() => {
        if (v < 0.4) { v += 0.05; song.volume = v; }
        else { clearInterval(fade); }
      }, 200);

      celebrate();
      
      // Hide original header/buttons
      document.getElementById("main-container").style.display = "none";
      
      // Reveal & Populate Schedule
      schedule.style.display = "block";
      schedule.innerHTML = `
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZueCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3oriO0OEd9QIDdllqo/giphy.gif" alt="Tiny Cat" class="cat-gif">
        <h1>Sabía que dirías que sí... ❤️</h1>
        <span class="emoji-float">🧸 🎀 🏹 🍬</span>
        
        <p>I’ve planned a day as special as you are:</p>

        <div style="text-align: left; margin: 20px auto; max-width: 400px;">
          <p>👟 <strong>8:30 AM</strong> — Atlanta Mission 5K<br><small>Pemberton Place</small></p>
          <p>🎁 <strong>12:00 PM</strong> — A surprise just for you</p>
          <p>🍽️ <strong>4:30 PM</strong> — The Crossing Steakhouse<br><small>Norcross</small></p>
        </div>

        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHR0amxicGZ4ZzB6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6ZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/K1T6pT28JjXqw/giphy.gif" alt="Happy Cat" class="cat-gif">

        <div style="text-align: left; margin: 20px auto; max-width: 400px;">
          <p>🏒 <strong>7:10 PM</strong> — Atlanta Gladiators vs Adirondack</p>
          <p>💃 <strong>11:00 PM – 3:00 AM</strong> — Candela Night<br><small>Atlanta NE</small></p>
        </div>

        <span class="emoji-float">🌹 🥂 💖 ✨ 🥂 🌹</span>
        <p><em>Te amo, Prechocha!</em></p>
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHIycG54ZzB6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6ZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/mlvseq9yvZhba/giphy.gif" alt="Love Cat" class="cat-gif">
      `;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>

</body>
</html>
